name: Job Hunter AI — Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend QA & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Python Syntax & Lint Verification
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Pytest Suite (OWASP WAF + Asturias Geography + Pitch AI + Scrapers)
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v --durations=10 -o asyncio_default_fixture_loop_scope=function

  frontend-qa:
    name: Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: TypeScript Type Checking
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://job-hunterai.vercel.app
        run: |
          npm run build

  pipeline-status:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]
    if: always()
    steps:
      - name: Check Overall Status
        run: |
          if [ "${{ needs.backend-qa.result }}" != "success" ] || [ "${{ needs.frontend-qa.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed. Review failed job logs above."
            exit 1
          fi
          echo "✅ All CI checks passed successfully! Ready for Railway & Vercel deployment."
